# Deploy Preview for deploy-platform service repos.
#
# Any PR touching platform/ gets a full render + validation and a sticky
# "Deploy Preview" comment with the SC-11 readiness scorecard.
name: Deploy Preview

on:
  pull_request:
    paths:
      - 'platform/**'
      # schema-version and context-ref live in this file, and they decide whether
      # rendering works at all. Without this, a pin bump to a broken toolkit or a
      # stale context digest merges with no preview -- which is how a release with a
      # context-resolution bug reached every repository.
      - '.github/workflows/deploy-preview.yml'

permissions: {}

jobs:
  deploy-preview:
    uses: JorisJonkers-dev/github-workflows/.github/workflows/deploy-validate.yml@6d4af5313cc39386fff796fa89ea940ef5f0819d # v0.16.1
    with:
      deploy-dir: platform
      schema-version: 0.22.0
      image-lock-path: platform/images.lock.json
      context-ref: ghcr.io/jorisjonkers-dev/cluster-deploy-context-public@sha256:e839b90839a5f33f1038d305531d9bb2cd85a3a627a436c395c4116533321cc9
      environments: production
      comment: true
    permissions:
      contents: read
      packages: read
      pull-requests: write
